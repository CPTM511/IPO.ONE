[profile.default]
src = "contracts"
test = "contracts/test"
script = "contracts/script"
out = "out/foundry"
cache_path = "cache/foundry"
libs = ["node_modules"]
remappings = [
  "forge-std/=node_modules/forge-std/src/",
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/"
]
solc = "0.8.30"
auto_detect_solc = false
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
bytecode_hash = "none"
cbor_metadata = false
ffi = false

[profile.default.fuzz]
runs = 512
seed = "0x49504f2e4f4e452d4d32412d46555a5a2d534545442d30303030303030303031"
max_test_rejects = 65536

[profile.default.invariant]
runs = 128
depth = 64
fail_on_revert = true
call_override = false
