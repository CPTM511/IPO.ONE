name: Quality Gate

on:
  push:
    branches-ignore:
      - codex/event-runtime-diagnostic-20261012
  pull_request:
  workflow_dispatch:
    inputs:
      validation_target:
        description: Temporary branch validation target
        type: choice
        default: event-diagnostic
        options:
          - event-diagnostic
          - repository-aggregate

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  event-diagnostic:
    name: Bounded synthetic event-runtime diagnostic
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/event-runtime-diagnostic-20261012' && inputs.validation_target != 'repository-aggregate'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
    steps:
      - name: Start the single-job total budget
        shell: bash
        run: |
          # Leave one minute inside the 15-minute job cap for cleanup/reporting.
          echo "IPO_ONE_DIAGNOSTIC_DEADLINE=$(( $(date +%s) + 840 ))" >> "$GITHUB_ENV"

      - name: Checkout approved diagnostic branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        timeout-minutes: 2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up reviewed Node.js 26
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        timeout-minutes: 2
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Run four bounded event-runtime cases
        shell: bash
        run: bash scripts/ci/run-event-runtime-diagnostic.sh

      - name: Remove only this run's disposable PostgreSQL containers
        if: always()
        shell: bash
        run: |
          docker ps --all --quiet \
            --filter "label=ipo-one-event-diagnostic=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            | xargs --no-run-if-empty docker rm --force >/dev/null

  repository-aggregate:
    name: Bounded original-candidate repository aggregate
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/event-runtime-diagnostic-20261012' && inputs.validation_target == 'repository-aggregate'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ipo_one_aggregate_test
    services:
      postgres:
        image: postgres:17.10-alpine3.23@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: ipo_one_aggregate_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ipo_one_aggregate_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Start the aggregate budget
        shell: bash
        run: echo "IPO_ONE_AGGREGATE_DEADLINE=$(( $(date +%s) + 1740 ))" >> "$GITHUB_ENV"
      - name: Checkout validation workflow
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        timeout-minutes: 2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up reviewed Node.js 26
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        timeout-minutes: 2
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Verify and run the exact product candidate once
        shell: bash
        run: |
          set -euo pipefail
          candidate=5cb16868a05fa23b9bec62975766e18b212492f2
          aggregate_root="$RUNNER_TEMP/ipo-one-aggregate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/codex/event-runtime-diagnostic-20261012
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          git merge-base --is-ancestor "$candidate" HEAD
          test "$(node --version)" = v26.5.0
          test ! -e "$aggregate_root"
          mkdir -p "$aggregate_root"
          cleanup() {
            result=$?
            trap - EXIT
            cd "$GITHUB_WORKSPACE"
            git worktree remove --force "$aggregate_root/candidate" >/dev/null 2>&1 || true
            rm -rf "$aggregate_root"
            exit "$result"
          }
          trap cleanup EXIT
          bounded() {
            maximum=$1
            shift
            remaining=$(( IPO_ONE_AGGREGATE_DEADLINE - $(date +%s) - 5 ))
            if (( remaining <= 0 )); then exit 124; fi
            if (( maximum > remaining )); then maximum=$remaining; fi
            timeout --signal=TERM --kill-after=5s "${maximum}s" "$@"
          }
          tool_prefix="$aggregate_root/pnpm-11.11.0"
          bounded 120 npm install --prefix "$tool_prefix" --save-exact --ignore-scripts \
            --registry=https://registry.npmjs.org pnpm@11.11.0
          node --input-type=module - "$tool_prefix/package-lock.json" <<'JS'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          const installer = JSON.parse(readFileSync(process.argv[2], "utf8")).packages["node_modules/pnpm"];
          assert.equal(installer.version, "11.11.0");
          assert.equal(installer.resolved, "https://registry.npmjs.org/pnpm/-/pnpm-11.11.0.tgz");
          assert.equal(installer.integrity, "sha512-RGP2X9gO2A1pvB1L8WPulPYFxzgPwxi7Wy6+FfjNEtScUaTVnpUbQB52TTtsp1HL9RvFDtcAGmvLSTXmhMNIgg==");
          JS
          bounded 90 npm audit --prefix "$tool_prefix" --audit-level=moderate
          export PATH="$tool_prefix/node_modules/.bin:$PATH"
          test "$(pnpm --version)" = 11.11.0
          bounded 60 sudo install -d -m 1777 /private/tmp
          git worktree add --detach "$aggregate_root/candidate" "$candidate"
          bounded 180 pnpm --dir "$aggregate_root/candidate" install --frozen-lockfile
          cd "$aggregate_root/candidate"
          test "$(git rev-parse HEAD)" = "$candidate"
          source_checkpoint() {
            python3 - <<'PY'
          import hashlib, json, pathlib, subprocess
          entries = []
          for name in subprocess.check_output(['git','ls-files','-z']).decode().split('\0'):
              if name and pathlib.Path(name).is_file():
                  data = pathlib.Path(name).read_bytes()
                  blob = hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
                  assert blob == subprocess.check_output(['git','rev-parse','HEAD:'+name]).decode().strip(), name
                  entries.append({'path':name,'sha256':hashlib.sha256(data).hexdigest()})
          encoded = json.dumps(entries, sort_keys=True, separators=(',',':')).encode()
          print(json.dumps({'head':subprocess.check_output(['git','rev-parse','HEAD']).decode().strip(), 'status':subprocess.check_output(['git','status','--porcelain']).decode(), 'trackedFiles':len(entries), 'trackedManifestSHA256':hashlib.sha256(encoded).hexdigest()}, sort_keys=True))
          PY
          }
          source_checkpoint > "$aggregate_root/source-before.json"
          cat "$aggregate_root/source-before.json"
          test -z "$(git status --porcelain)"
          printf 'Workflow SHA: %s; exact aggregate product SHA: %s\n' "$GITHUB_SHA" "$candidate"
          set +e
          bounded 1740 pnpm run check
          test_exit=$?
          set -e
          source_checkpoint > "$aggregate_root/source-after.json"
          cat "$aggregate_root/source-after.json"
          cmp "$aggregate_root/source-before.json" "$aggregate_root/source-after.json"
          test -z "$(git status --porcelain)"
          printf 'AGGREGATE_RESULT candidate=%s exit=%s\n' "$candidate" "$test_exit"
          printf 'Candidate `%s`, workflow `%s`, aggregate exit `%s`. No observer, retry, assertion/deadline change, artifacts or remote cache.\n' "$candidate" "$GITHUB_SHA" "$test_exit" >> "$GITHUB_STEP_SUMMARY"
          exit "$test_exit"

  verify:
    name: Product, protocol, security, and PostgreSQL
    if: github.ref != 'refs/heads/codex/event-runtime-diagnostic-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ipo_one_test
    services:
      postgres:
        # Official image index digest resolved 2026-07-12.
        image: postgres:17.10-alpine3.23@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: ipo_one_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ipo_one_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 26
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install and audit reviewed pnpm directly
        shell: bash
        run: |
          set -euo pipefail
          tool_prefix="$RUNNER_TEMP/ipo-one-pnpm-11.11.0"
          npm install --prefix "$tool_prefix" --save-exact --ignore-scripts \
            --registry=https://registry.npmjs.org pnpm@11.11.0
          node --input-type=module - "$tool_prefix/package-lock.json" <<'JS'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          const installer = JSON.parse(readFileSync(process.argv[2], "utf8"))
            .packages["node_modules/pnpm"];
          assert.equal(installer.version, "11.11.0");
          assert.equal(installer.resolved, "https://registry.npmjs.org/pnpm/-/pnpm-11.11.0.tgz");
          assert.equal(installer.integrity, "sha512-RGP2X9gO2A1pvB1L8WPulPYFxzgPwxi7Wy6+FfjNEtScUaTVnpUbQB52TTtsp1HL9RvFDtcAGmvLSTXmhMNIgg==");
          JS
          npm audit --prefix "$tool_prefix" --audit-level=moderate
          echo "$tool_prefix/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Verify reviewed pnpm version
        shell: bash
        run: test "$(pnpm --version)" = "11.11.0"

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare reviewed private temporary boundary
        run: sudo install -d -m 1777 /private/tmp

      - name: Verify abuse policy classification and drift regressions
        run: |
          pnpm run check:abuse-policy
          node --test modules/abuse-control/test/abuse-policy-gate.test.js

      - name: Run repository quality gate
        run: pnpm run check

      - name: Install Chromium for real click-path acceptance
        run: pnpm exec playwright install --with-deps chromium

      - name: Run real browser click-path gate
        run: pnpm run test:browser:click-path

      - name: Run isolated BNB wallet sign-in regression gate
        run: pnpm run test:browser:wallet-sign-in

      - name: Run isolated read-only record recovery regression gate
        run: pnpm run test:browser:record-recovery

      - name: Run isolated vertical slice
        if: github.event_name == 'workflow_dispatch'
        run: pnpm run demo

      - name: Audit production dependencies
        run: pnpm audit --prod

      - name: Build and harden-smoke production container
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          smoke_root="$RUNNER_TEMP/ipo-one-production-container-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            cleanup_status=$?
            trap - EXIT
            docker rm --force ipo-one-ci >/dev/null 2>&1 || true
            docker rm --force ipo-one-ci-bootstrap >/dev/null 2>&1 || true
            sudo chown -R "$(id -u):$(id -g)" "$smoke_root/secrets" \
              >/dev/null 2>&1 || true
            if ! node scripts/prepare-production-container-smoke.mjs cleanup \
              --directory "$smoke_root"; then
              echo "Production container smoke fixture cleanup failed." >&2
              exit 1
            fi
            exit "$cleanup_status"
          }
          readiness_failure() {
            echo "Production container did not become ready; redacted runtime logs follow." >&2
            docker logs ipo-one-ci 2>&1 | node \
              scripts/prepare-production-container-smoke.mjs redact \
              --directory "$smoke_root" >&2 || true
            return 1
          }
          trap cleanup EXIT
          docker build --build-arg BUILD_REVISION="${GITHUB_SHA}" --tag ipo-one:ci .
          runtime_user="$(docker inspect --format='{{.Config.User}}' ipo-one:ci)"
          echo "Runtime user: $runtime_user"
          test "$runtime_user" = "65532:65532"
          runtime_version="$(docker run --rm --entrypoint=/nodejs/bin/node ipo-one:ci --version)"
          echo "Runtime Node: $runtime_version"
          test "$runtime_version" = "v26.5.0"
          if docker run --rm --entrypoint=/bin/sh ipo-one:ci -c true; then
            echo "Production image unexpectedly contains a shell" >&2
            exit 1
          fi

          node scripts/prepare-production-container-smoke.mjs prepare \
            --directory "$smoke_root" \
            --release "$GITHUB_SHA"
          sudo chown -R 65532:65532 "$smoke_root/secrets"
          docker run --rm --name ipo-one-ci-bootstrap \
            --add-host host.docker.internal:host-gateway \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --pids-limit 128 \
            --memory 768m \
            --cpus 1 \
            --env-file "$smoke_root/bootstrap.env" \
            --mount "type=bind,source=$smoke_root/secrets,target=/run/ipo-one-smoke,readonly" \
            ipo-one:ci apps/private-pilot/src/bootstrap-production.js
          docker run --detach --name ipo-one-ci \
            --add-host host.docker.internal:host-gateway \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --pids-limit 128 \
            --memory 768m \
            --cpus 1 \
            --publish 127.0.0.1:3001:8080 \
            --env-file "$smoke_root/runtime.env" \
            --mount "type=bind,source=$smoke_root/secrets,target=/run/ipo-one-smoke,readonly" \
            ipo-one:ci
          ready=false
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3001/livez > /dev/null; then
              if curl --fail --silent http://127.0.0.1:3001/readyz > /dev/null; then
                ready=true
                break
              fi
            fi
            sleep 1
          done
          test "$ready" = true || readiness_failure
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header 'Host: ipo.one' \
            --header 'X-Forwarded-Proto: https' \
            --header 'X-Forwarded-For: 127.0.0.1' \
            http://127.0.0.1:3001/)" = "421"
          curl --config "$smoke_root/request.curl" \
            http://127.0.0.1:3001/ > /dev/null
          discovery="$(curl --config "$smoke_root/request.curl" \
            http://127.0.0.1:3001/.well-known/ipo-one.json)"
          node -e "const value = JSON.parse(process.argv[1]); if (value.safety.realFundsEnabled !== false || value.interfaces.agentApi !== 'https://ipo.one/tenant/v1/operations' || value.deployment.releaseId !== process.argv[2]) process.exit(1)" "$discovery" "$GITHUB_SHA"

      - name: Run retained legacy demonstration compatibility smoke
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          pnpm run dev:legacy-demo > "$RUNNER_TEMP/ipo-one-legacy-demo.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/healthz > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3000/healthz > /dev/null
          pnpm run smoke:api
