packages:
  - "apps/*"
  - "packages/*"
  - "modules/*"

verifyDepsBeforeRun: false

# pnpm 11 fails closed when a dependency with an install script is not reviewed.
# Keep this list exact: AppKit performs a local version-consistency check and
# esbuild verifies/prepares its integrity-bound platform binary. Foundry's
# wrapper resolves its already integrity-bound optional platform package, so
# its network-capable fallback install script is explicitly denied.
allowBuilds:
  "@foundry-rs/forge": false
  "@reown/appkit": true
  "esbuild": true

overrides:
  fast-uri: "3.1.5"
  axios: "1.18.0"
